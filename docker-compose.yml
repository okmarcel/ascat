services:
  postgres:
    image: postgres:16
    container_name: ascat-postgres
    command: ["postgres", "-c", "timezone=UTC"]

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/00_create_schema.sql:/docker-entrypoint-initdb.d/00_create_schema.sql:ro
      - ./database/migrations/01_views_functions_grants.sql:/docker-entrypoint-initdb.d/01_views_functions_grants.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
